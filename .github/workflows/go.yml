name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # The runner image resolves apt through a mirrorlist that puts an Azure
    # mirror first, and that mirror stalls rather than refusing: an unbounded
    # apt-get update has burned an entire job on "Ign:" retries. Each call is
    # bounded so a stalled mirror costs a retry instead of the run, and the
    # step timeout is the backstop for a stall the inner bound cannot see.
    - name: Install unrar (Ubuntu)
      timeout-minutes: 6
      run: |
        for attempt in 1 2 3; do
          sudo timeout 120 apt-get update && break
          echo "::warning::apt-get update stalled or failed (attempt $attempt/3)"
        done
        sudo timeout 180 apt-get install -y unrar

    # The oracle tests skip themselves when unrar is absent, so an install
    # that fails without stopping the job would produce a green run with no
    # differential coverage at all. Fail here instead, where the cause is
    # still visible. This mirrors exec.LookPath, which is what those tests
    # actually branch on.
    - name: Verify unrar is present
      run: command -v unrar

    - name: Verify go.mod Tidy
      run: |
        go mod tidy
        git diff --exit-code

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Tests with Race Detector
      run: go test -v -race -shuffle=on ./...

    - name: Run Benchmarks
      run: go test -bench=. -benchmem ./...

  crossbuild:
    name: 32-bit Build & Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    # Values parsed from an archive are sized against int, so a stream can
    # produce a negative where int is 32 bits. Vet rather than build: build
    # skips test files, which is how a set of 32-bit regression tests once
    # passed while failing to compile for the platform they cover.
    - name: Vet on 32-bit targets
      run: |
        for arch in 386 arm; do
          echo "== GOARCH=$arch =="
          GOARCH=$arch go vet ./...
        done

    # linux/386 binaries execute on an amd64 Linux runner, so the platform this
    # job exists for can actually run its own assertions rather than only
    # compiling them. Every 32-bit claim in CLAUDE.md was reasoning nobody had
    # executed until this step existed.
    #
    # No -race: the detector is not supported on linux/386, and the 64-bit job
    # above already runs it. GOARCH=arm stays vet-only above -- those binaries
    # need qemu, which is more setup than the coverage is worth while 386
    # exercises the same int width.
    - name: Test on linux/386
      env:
        GOARCH: "386"
      run: go test -count=1 -shuffle=on ./...
