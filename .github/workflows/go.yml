name: Go CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: [ '1.22', '1.23', 'stable' ]

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install unrar (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y unrar

    - name: Verify go.mod Tidy
      run: |
        go mod tidy
        git diff --exit-code

    - name: Run Go Vet
      run: go vet ./...

    - name: Run Tests with Race Detector
      run: go test -v -race -shuffle=on ./...

    - name: Run Benchmarks
      run: go test -bench=. -benchmem ./...
